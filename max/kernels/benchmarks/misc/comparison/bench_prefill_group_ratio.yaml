name: bench_prefill_group_ratio
file: $BUILD_WORKSPACE_DIRECTORY/max/kernels/benchmarks/misc/comparison/bench_blackwell_prefill.py

prefill-ratio-commons: &prefill-ratio-commons
  $causal: [True]
  $engine: ["modular_max", "flashinfer"]
  model: "gqa_sweep"

params:
- <<: *prefill-ratio-commons
  $num_q_heads: [32]
  $num_kv_heads: [32, 16, 8, 4, 2]
  $head_dim: 128
  $batch_size: [1, 2]
  $qkv_len: [2048, 4096, 8192]
- <<: *prefill-ratio-commons
  $num_q_heads: [64]
  $num_kv_heads: [64, 32, 16, 8, 4]
  $head_dim: 128
  $batch_size: [1, 2]
  $qkv_len: [2048, 4096, 8192]
